<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUNSTER - Enterprise Traffic & Slots Operations</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 30px -10px rgba(37, 99, 235, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; letter-spacing: -0.3px; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.65; -webkit-font-smoothing: antialiased; }

    /* 헤더 및 프리미엄 로고 디자인 고도화 */
    header { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-sm); }
    .logo-area { display: flex; align-items: center; gap: 14px; cursor: pointer; text-decoration: none; }
    
    .logo-icon { 
      width: 46px; height: 46px; 
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%); 
      color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; 
      font-weight: 900; font-size: 1.4rem; 
      border: 1.5px solid #bfdbfe;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      animation: premiumLogoGlow 3.5s infinite ease-in-out;
    }
    @keyframes premiumLogoGlow {
      0% { box-shadow: 0 0 10px rgba(37,99,235,0.3), inset 0 2px 4px rgba(255,255,255,0.4); transform: scale(1); }
      50% { box-shadow: 0 0 26px rgba(59,130,246,0.7), 0 0 12px rgba(147,197,253,0.5), inset 0 2px 6px rgba(255,255,255,0.8); transform: scale(1.03); }
      100% { box-shadow: 0 0 10px rgba(37,99,235,0.3), inset 0 2px 4px rgba(255,255,255,0.4); transform: scale(1); }
    }

    .logo-text-box { display: flex; flex-direction: column; }
    .logo-main-title { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1; }
    .logo-sub-title { font-size: 0.68rem; font-weight: 800; color: var(--text-sub); letter-spacing: 1.2px; text-transform: uppercase; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .bgm-player-box { display: flex; align-items: center; gap: 6px; background: var(--primary-light); padding: 6px 14px; border-radius: 20px; border: 1px solid #bfdbfe; font-size: 0.78rem; }
    .bgm-label { font-weight: 700; color: var(--primary); }
    .bgm-btn { color: #1d4ed8; text-decoration: none; font-weight: 800; }
    .bgm-btn:hover { text-decoration: underline; }

    .auth-actions { display: flex; gap: 8px; }
    .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main); padding: 4px; }
    .mobile-nav { display: none; position: absolute; top: 72px; left: 0; width: 100%; background: white; border-bottom: 1px solid var(--border); padding: 16px; box-shadow: var(--shadow-md); flex-direction: column; gap: 10px; }

    .wrapper { max-width: 1080px; margin: 0 auto; padding: 28px 16px; }
    .page-view { display: none; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .page-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .hero { text-align: center; padding: 52px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--shadow-sm); }
    .hero-badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 0.74rem; font-weight: 800; padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; border: 1px solid #bfdbfe; letter-spacing: 0.5px; }
    .hero h1 { font-size: 1.85rem; font-weight: 900; letter-spacing: -0.6px; margin-bottom: 14px; color: var(--text-main); line-height: 1.35; }
    .hero p { font-size: 0.95rem; color: var(--text-sub); max-width: 660px; margin: 0 auto 20px auto; line-height: 1.6; }

    .card-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.84rem; cursor: pointer; border: 1px solid var(--border); background: white; color: var(--text-main); text-decoration: none; transition: all 0.2s ease; }
    .btn:hover { background: var(--bg-main); border-color: #cbd5e1; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-danger:hover { background: #dc2626; }

    .auth-container { max-width: 520px; margin: 24px auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-md); }
    .auth-container h2 { font-size: 1.5rem; font-weight: 900; text-align: center; margin-bottom: 8px; color: var(--text-main); letter-spacing: -0.5px; }
    .auth-container p { font-size: 0.86rem; color: var(--text-sub); text-align: center; margin-bottom: 24px; }
    
    .form-grid { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.82rem; font-weight: 800; color: var(--text-main); }
    .form-input, .form-select, .form-textarea { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none; background: #fff; transition: all 0.2s ease; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
    .form-textarea { resize: vertical; min-height: 90px; }

    .dashboard-container { display: flex; flex-direction: column; gap: 20px; }
    .server-status-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--bg-main); border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.88rem; margin-bottom: 10px; }
    .badge-status { font-size: 0.74rem; font-weight: 800; padding: 5px 12px; border-radius: 8px; }
    .status-pending { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .status-complete { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }

    .data-table-wrapper { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 12px; -webkit-overflow-scrolling: touch; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.84rem; white-space: nowrap; background: white; }
    .data-table th, .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .data-table th { background: #f8fafc; font-weight: 800; color: var(--text-main); }
    .data-table tr:hover { background: #fafafa; }

    footer { text-align: center; padding: 40px 16px; border-top: 1px solid var(--border); margin-top: 60px; font-size: 0.82rem; color: var(--text-sub); background: var(--card-bg); line-height: 1.8; }
    .footer-content { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 850px; margin: 0 auto; }
    .footer-ceo-row { display: flex; justify-content: center; align-items: center; gap: 20px; font-weight: 700; color: var(--text-main); font-size: 0.9rem; flex-wrap: wrap; }

    .pulse-dot { display: inline-block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

    @media (max-width: 768px) {
      .auth-actions { display: none; }
      .mobile-menu-btn { display: block; }
      .mobile-nav.active { display: flex; }
      .hero h1 { font-size: 1.45rem; }
      .hero { padding: 32px 14px; }
      .card-box { padding: 16px; }
      .footer-ceo-row { flex-direction: column; gap: 4px; }
    }
  </style>
  <script>
    const ACCOUNT_INFO = { bank: "우리은행", accountNumber: "1002-862-588371", holder: "김종훈" };
    let currentUser = JSON.parse(localStorage.getItem('hunster_user')) || null;
    let currentAdminTab = 'coupang';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthUI();
      logVisitorIP();
      const path = window.location.hash.replace('#', '');
      if(path && document.getElementById(path)) {
        switchView(path);
      } else {
        switchView('view-main');
      }
    });

    function switchView(viewId) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if(target) {
        target.classList.add('active');
        window.scrollTo(0,0);
        if(viewId === 'view-user-dashboard' && currentUser) {
          renderUserDashboard(currentUser);
        } else if(viewId === 'view-admin') {
          loadAdminData();
        }
      }
    }

    function goHome() { switchView('view-main'); }

    function checkAuthUI() {
      const container = document.getElementById('auth-actions-container');
      const mobileNav = document.getElementById('mobile-nav');
      if(!container) return;

      if(currentUser) {
        let dashBtn = currentUser.id === 'hun1' ? 
          `<button class="btn btn-primary" onclick="switchView('view-admin')" style="padding:7px 14px; font-size:0.78rem;">관리자 대시보드</button>` :
          `<button class="btn btn-primary" onclick="switchView('view-user-dashboard')" style="padding:7px 14px; font-size:0.78rem;">파트너 대시보드</button>`;
        
        container.innerHTML = `${dashBtn} <button class="btn btn-danger" onclick="handleLogout()" style="padding:7px 14px; font-size:0.78rem;">로그아웃</button>`;
        if(mobileNav) mobileNav.innerHTML = `${dashBtn} <button class="btn btn-danger" onclick="handleLogout()" style="width:100%;">로그아웃</button>`;
      } else {
        container.innerHTML = `
          <button class="btn" onclick="switchView('view-login')" style="padding:7px 14px; font-size:0.78rem;">로그인</button>
          <button class="btn btn-primary" onclick="switchView('view-register')" style="padding:7px 14px; font-size:0.78rem;">파트너 회원가입</button>
        `;
        if(mobileNav) mobileNav.innerHTML = `
          <button class="btn" onclick="switchView('view-login')" style="width:100%;">로그인</button>
          <button class="btn btn-primary" onclick="switchView('view-register')" style="width:100%;">파트너 회원가입</button>
        `;
      }
    }

    function toggleMobileMenu() {
      const nav = document.getElementById('mobile-nav');
      if(nav) nav.classList.toggle('active');
    }

    async function logVisitorIP() {
      try {
        await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ip: '211.234.' + Math.floor(Math.random() * 200) + '.' + Math.floor(Math.random() * 200),
            name: currentUser ? currentUser.name + ' (' + currentUser.id + ')' : '비회원 방문자',
            id: currentUser ? currentUser.id : 'guest',
            time: new Date().toLocaleString(),
            device: navigator.userAgent
          })
        });
      } catch(e) {}
    }

    function updateRegisterFields() {
      const service = document.getElementById('service-select').value;
      const cBox = document.getElementById('reg-fields-coupang');
      const rBox = document.getElementById('reg-fields-reward');
      const pBox = document.getElementById('reg-fields-place');
      
      if(cBox) cBox.style.display = service.includes('쿠팡') ? 'block' : 'none';
      if(rBox) rBox.style.display = service.includes('리워드') ? 'block' : 'none';
      if(pBox) pBox.style.display = service.includes('플레이스') ? 'block' : 'none';
    }

    async function handleRegister(event) {
      event.preventDefault();
      const service = document.getElementById('service-select').value;
      
      let payload = {
        name: document.getElementById('reg-name').value.trim(),
        id: document.getElementById('reg-id').value.trim(),
        pw: document.getElementById('reg-pw').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        address: document.getElementById('reg-address').value.trim(),
        businessNumber: document.getElementById('reg-business-number').value.trim(),
        service,
        reason: document.getElementById('reg-reason').value.trim(),
        slots: parseInt(document.getElementById('reg-slots').value) || 5
      };

      if(service.includes('쿠팡')) {
        payload.targetKeyword = document.getElementById('reg-coupang-keyword').value;
        payload.targetUrl = document.getElementById('reg-coupang-url').value;
      } else if(service.includes('리워드')) {
        payload.storeName = document.getElementById('reg-reward-store').value;
        payload.targetKeyword = document.getElementById('reg-reward-keyword').value;
        payload.targetUrl = document.getElementById('reg-reward-url').value;
        payload.actionType = document.getElementById('reg-reward-action').value;
      } else if(service.includes('플레이스')) {
        payload.storeName = document.getElementById('reg-place-store').value;
        payload.targetKeyword = document.getElementById('reg-place-keyword').value;
        payload.targetUrl = document.getElementById('reg-place-id').value;
        payload.actionType = document.getElementById('reg-place-action').value;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.success) {
          alert('🎉 HUNSTER 파트너 가입 및 슬롯 신청이 완료되었습니다!');
          switchView('view-login');
        } else {
          alert(data.message || '회원가입 실패');
        }
      } catch(e) {
        alert('서버 통신 오류가 발생했습니다.');
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const id = document.getElementById('login-id').value.trim();
      const pw = document.getElementById('login-pw').value.trim();

      if(id === 'hun1' && pw === '1234') {
        currentUser = { id: 'hun1', name: '최고관리자' };
        localStorage.setItem('hunster_user', JSON.stringify(currentUser));
        checkAuthUI();
        switchView('view-admin');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, pw })
        });
        const data = await res.json();
        if(data.success) {
          currentUser = data.user;
          localStorage.setItem('hunster_user', JSON.stringify(currentUser));
          checkAuthUI();
          switchView('view-user-dashboard');
        } else {
          alert(data.message || '아이디 또는 비밀번호를 확인해주세요.');
        }
      } catch(e) {
        alert('로그인 중 서버 통신 오류가 발생했습니다.');
      }
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('hunster_user');
      checkAuthUI();
      switchView('view-main');
      alert('로그아
