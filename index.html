<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUNSTER - Enterprise Traffic & Slot Operations</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc; --bg-card: #ffffff; --border: #e2e8f0; --border-subtle: #f1f5f9;
      --text-main: #0f172a; --text-sub: #64748b; --primary: #2563eb; --primary-hover: #1d4ed8;
      --primary-light: #eff6ff; --success: #059669; --success-bg: #ecfdf5; --warning-bg: #fffbeb; --warning-text: #d97706;
      --danger: #dc2626; --danger-bg: #ffeeef;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.06); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; word-break: keep-all; overflow-x: hidden; padding-bottom: 60px; }
    
    header { height: 60px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 14px; background: rgba(255, 255, 255, 0.98); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
    .logo-area { display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
    
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 1rem; box-shadow: 0 0 12px rgba(37, 99, 235, 0.6); flex-shrink: 0; animation: logoGlow 2s infinite alternate; }
    @keyframes logoGlow {
      0% { box-shadow: 0 0 6px rgba(37, 99, 235, 0.4); transform: scale(1); }
      100% { box-shadow: 0 0 18px rgba(37, 99, 235, 0.95), 0 0 28px rgba(59, 130, 246, 0.6); transform: scale(1.04); }
    }

    .logo-text-box { display: flex; flex-direction: column; }
    .logo-main-title { font-weight: 900; font-size: 1rem; letter-spacing: -0.5px; background: linear-gradient(90deg, #0f172a 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1; }
    .logo-sub-title { font-size: 0.55rem; font-weight: 700; color: var(--primary); letter-spacing: 0.8px; text-transform: uppercase; }
    
    .header-right { display: flex; gap: 6px; align-items: center; }
    .auth-actions { display: flex; gap: 4px; align-items: center; }
    
    .bgm-player-box { display: flex; align-items: center; gap: 4px; background: var(--primary-light); padding: 3px 6px; border-radius: 10px; border: 1px solid #bfdbfe; }
    .bgm-btn { background: var(--primary); color: white; border: none; padding: 2px 6px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; white-space: nowrap; }
    .bgm-btn:hover { background: var(--primary-hover); }
    .bgm-label { font-size: 0.65rem; font-weight: 700; color: var(--primary); white-space: nowrap; display: inline-block; }

    .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); padding: 2px; }
    .mobile-nav { display: none; position: absolute; top: 60px; left: 0; width: 100%; background: white; border-bottom: 1px solid var(--border); padding: 14px; flex-direction: column; gap: 10px; box-shadow: var(--shadow-lg); z-index: 99; }
    .mobile-nav.active { display: flex; }

    .btn { padding: 5px 10px; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: white; color: var(--text-main); white-space: nowrap; transition: 0.2s; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger-bg); border-color: #fca5a5; color: var(--danger); font-weight: 700; }
    .btn-danger:hover { background: #fee2e2; }
    
    .page-view { display: none !important; }
    .page-view.active { display: block !important; }

    .wrapper { max-width: 1200px; margin: 0 auto; padding: 20px 12px; display: flex; flex-direction: column; gap: 24px; }
    
    .hero { text-align: center; padding: 12px 0; }
    .hero-badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; margin-bottom: 10px; }
    .hero h1 { font-size: 1.45rem; font-weight: 800; color: #0f172a; line-height: 1.25; margin-bottom: 10px; word-break: keep-all; }
    .hero p { font-size: 0.85rem; color: var(--text-sub); max-width: 580px; margin: 0 auto 16px auto; word-break: keep-all; }
    
    .card-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
    .card-box h3 { font-size: 1rem; font-weight: 800; margin-bottom: 10px; color: #0f172a; }
    .server-status-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fafafa; border: 1px solid var(--border-subtle); border-radius: 8px; margin-bottom: 8px; font-size: 0.82rem; gap: 6px; }
    .server-status-item:last-child { margin-bottom: 0; }

    .pulse-dot { width: 9px; height: 9px; background-color: var(--success); border-radius: 50%; display: inline-block; box-shadow: 0 0 0 rgba(5, 150, 105, 0.4); animation: pulse 1.6s infinite; }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.6); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(5, 150, 105, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
    }

    .auth-container { width: 100%; max-width: 420px; margin: 16px auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 14px; box-shadow: var(--shadow-md); }
    .auth-container h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; color: #0f172a; }
    .auth-container p { color: var(--text-sub); font-size: 0.78rem; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-label { font-size: 0.78rem; font-weight: 700; color: #334155; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 0.88rem; background: #fafafa; outline: none; color: #0f172a; font-weight: 500; }
    .form-textarea { resize: vertical; min-height: 75px; }
    
    .dashboard-container { max-width: 1200px; margin: 12px auto; padding: 0 4px; }
    .status-section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .data-table-wrapper { overflow-x: auto; background: white; border-radius: 8px; border: 1px solid var(--border); margin-top: 8px; -webkit-overflow-scrolling: touch; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .data-table th, .data-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .data-table th { background: var(--border-subtle); color: var(--text-sub); font-size: 0.72rem; font-weight: 700; }
    
    .badge-status { padding: 3px 6px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; cursor: pointer; border: none; display: inline-block; text-align: center; white-space: nowrap; }
    .status-pending { background: var(--warning-bg); color: var(--warning-text); }
    .status-complete { background: var(--success-bg); color: var(--success); }

    footer { text-align: center; padding: 16px 12px; color: var(--text-sub); font-size: 0.75rem; border-top: 1px solid var(--border); background: white; margin-top: 24px; }

    @media (max-width: 768px) {
      header { padding: 0 10px; height: 54px; }
      .logo-main-title { font-size: 0.9rem; }
      .logo-icon { width: 28px; height: 28px; font-size: 0.9rem; border-radius: 6px; }
      .bgm-label { display: none; }
      .bgm-player-box { padding: 2px 5px; border-radius: 8px; }
      .bgm-btn { font-size: 0.65rem; padding: 2px 5px; }
      .mobile-menu-btn { display: block; }
      .mobile-nav { top: 54px; padding: 10px; }
      .status-section-grid { grid-template-columns: 1fr; gap: 8px; }
      .auth-container { margin: 8px auto; padding: 14px 10px; border-radius: 10px; }
      .card-box { padding: 12px; border-radius: 9px; margin-bottom: 10px; }
      .dashboard-container { padding: 0 2px; }
      .btn { padding: 5px 8px; font-size: 0.78rem; }
      #admin-quick-nav { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
  <script>
    const ACCOUNT_INFO = { bank: "카카오뱅크", accountNumber: "3333-22-922-9190", holder: "김*훈" };
    let currentUser = null;

    function updateHeaderAuthUI() {
      const authActions = document.getElementById('auth-actions-container');
      const mobileNav = document.getElementById('mobile-nav');
      const savedUser = localStorage.getItem('hunster_user');
      const savedRole = localStorage.getItem('hunster_role');

      if (!authActions) return;

      let authHtml = '';
      if (savedRole === 'admin' || savedUser) {
        authHtml = `<button class="btn btn-danger" onclick="handleLogout()">로그아웃</button>`;
      } else {
        authHtml = `
          <button class="btn" onclick="switchView('view-login')">로그인</button>
          <button class="btn btn-primary" onclick="switchView('view-register')">회원가입</button>
        `;
      }
      authActions.innerHTML = authHtml;
      if (mobileNav) {
        mobileNav.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
            <a href="https://www.youtube.com/watch?v=YTdupRzvQ5M&list=RDYTdupRzvQ5M&start_radio=1" target="_blank" class="btn btn-primary" style="text-align:center; padding: 9px;">🎵 비와이 & 씨잼 Puzzle 유튜브 시청</a>
            ${savedRole === 'admin' || savedUser ? '<button class="btn btn-danger" style="width:100%; padding: 9px;" onclick="handleLogout()">로그아웃</button>' : '<div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;"><button class="btn" style="padding: 9px;" onclick="switchView(\'view-login\')">로그인</button><button class="btn btn-primary" style="padding: 9px;" onclick="switchView(\'view-register\')">회원가입</button></div>'}
          </div>
        `;
      }
    }

    function goHome() {
      const savedRole = localStorage.getItem('hunster_role');
      const savedUser = localStorage.getItem('hunster_user');

      if (savedRole === 'admin') {
        switchView('view-admin');
        loadAdminData();
      } else if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          renderUserDashboard(currentUser);
          switchView('view-user-dashboard');
        } catch(e) {
          switchView('view-main');
        }
      } else {
        switchView('view-main');
      }
    }

    function switchView(viewId) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if(target) target.classList.add('active');
      const mobileNav = document.getElementById('mobile-nav');
      if(mobileNav) mobileNav.classList.toggle('active', false);
      window.scrollTo(0, 0);
      updateHeaderAuthUI();
    }

    function toggleMobileMenu() {
      const mobileNav = document.getElementById('mobile-nav');
      if(mobileNav) mobileNav.classList.toggle('active');
    }

    // 관리자 섹션 열기/닫기(토글) 함수
    function toggleAdminSec(secId) {
      const el = document.getElementById(secId);
      if (el) {
        if (el.style.display === 'none' || el.style.display === '') {
          el.style.display = 'block';
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          el.style.display = 'none';
        }
      }
    }

    function copyAccountNumber() {
      const textToCopy = ACCOUNT_INFO.bank + " " + ACCOUNT_INFO.accountNumber + " (" + ACCOUNT_INFO.holder + ")";
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert("📋 입금 계좌번호가 클립보드에 복사되었습니다!\n" + textToCopy);
      }).catch(err => {
        alert("복사에 실패했습니다.");
      });
    }

    async function trackVisitor(userName = "비회원 (일반 방문)", userId = "-") {
      try {
        let userIp = "121.160.XXX.XX";
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        userIp = data.ip;
        
        await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: userIp, name: userName, id: userId, time: new Date().toLocaleString(), device: navigator.userAgent.includes('Mobile') ? '모바일' : 'PC 웹' })
        });
      } catch(e) {}
    }

    window.onload = async function() {
      const savedUser = localStorage.getItem('hunster_user');
      const savedRole = localStorage.getItem('hunster_role');

      if (savedRole === 'admin') {
        switchView('view-admin');
        loadAdminData();
      } else if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          renderUserDashboard(currentUser);
          switchView('view-user-dashboard');
        } catch(e) {
          localStorage.removeItem('hunster_user');
          switchView('view-main');
        }
      } else {
        switchView('view-main');
        trackVisitor();
      }
      updateHeaderAuthUI();
    };

    async function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value;
      const id = document.getElementById('reg-id').value;
      const pw = document.getElementById('reg-pw').value;
      const phone = document.getElementById('reg-phone').value;
      const address = document.getElementById('reg-address').value;
      const coupangSub = document.getElementById('coupang-sub-select').value;
      const slotCount = parseInt(document.getElementById('reg-slots').value) || 5;
      
      if (slotCount < 5) { alert('슬롯은 최소 5개 이상부터 신청 가능합니다.'); return; }
      
      const response = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, id, pw, phone, address, coupangSub, slots: slotCount })
      });
      
      const result = await response.json();
      if(result.success) {
        alert('회원가입 완료!\n[입금 계좌]\n' + ACCOUNT_INFO.bank + ' ' + ACCOUNT_INFO.accountNumber + ' (' + ACCOUNT_INFO.holder + ')\n\n※ 입금자명과 신청자 성함이 다를 경우 1:1 문의로 꼭 남겨주세요!');
        trackVisitor(name + ' (회원가입)', id);
        switchView('view-login');
      } else {
        alert(result.message);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const inputId = document.getElementById('login-id').value.trim();
      const inputPw = document.getElementById('login-pw').value.trim();
      
      if (inputId === 'hun1' && inputPw === '1234') {
        localStorage.setItem('hunster_role', 'admin');
        localStorage.removeItem('hunster_user');
        switchView('view-admin');
        loadAdminData();
        trackVisitor('최고관리자', 'hun1');
        updateHeaderAuthUI();
        return;
      }
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: inputId, pw: inputPw })
        });
        const data = await res.json();
        
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('hunster_user', JSON.stringify(currentUser));
          localStorage.removeItem('hunster_role');
          
          trackVisitor(currentUser.name + ' (로그인)', currentUser.id);
          renderUserDashboard(currentUser);
          switchView('view-user-dashboard');
          updateHeaderAuthUI();
        } else {
          alert(data.message || '아이디 또는 비밀번호가 일치하지 않습니다.');
        }
      } catch (err) {
        alert('서버 통신 중 오류가 발생했습니다.');
      }
    }

    function handleLogout() {
      localStorage.removeItem('hunster_user');
      localStorage.removeItem('hunster_role');
      currentUser = null;
      alert('로그아웃 되었습니다.');
      switchView('view-main');
      updateHeaderAuthUI();
    }

    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/data');
        const data = await res.json();
        
        let userTbody = document.getElementById('admin-user-tbody');
        let taxTbody = document.getElementById('admin-tax-tbody');

        if(userTbody || taxTbody) {
          if(userTbody) userTbody.innerHTML = '';
          if(taxTbody) taxTbody.innerHTML = '';

          if(data.users && data.users.length > 0) {
            data.users.forEach((u) => {
              let depositClass = u.depositStatus === '입금완료' ? 'status-complete' : 'status-pending';
              let taxClass = u.taxStatus === '발행완료' ? 'status-complete' : 'status-pending';
              
              if(userTbody) {
                userTbody.innerHTML += `<tr>
                  <td><strong>${u.name}</strong><br><span style="color:var(--text-sub); font-size:0.7rem;">(${u.id})</span></td>
                  <td>${u.phone || '-'}<br><span style="color:var(--text-sub); font-size:0.7rem;">${u.address || '-'}</span></td>
                  <td>
                    <span style="color:var(--primary); font-weight:700;">${u.service || '쿠팡 트래픽'}</span><br>
                    <div style="display:flex; align-items:center; gap:4px; margin-top:3px;">
                      <input type="number" id="slot-input-${u.id}" value="${u.slots || 5}" style="width:60px; padding:2px 4px; font-size:0.75rem;" class="form-input" min="1">
                      <button class="btn btn-primary" style="padding:2px 5px; font-size:0.65rem;" onclick="updateUserSlots('${u.id}')">변경</button>
                    </div>
                  </td>
                  <td><button class="badge-status ${depositClass}" onclick="toggleStatus('${u.id}', 'deposit')">${u.depositStatus || '입금대기'}</button></td>
                  <td><button class="btn btn-danger" style="padding:2px 5px; font-size:0.68rem;" onclick="deleteUser('${u.id}', '${u.name}')">삭제</button></td>
                </tr>`;
              }

              if(taxTbody) {
                taxTbody.innerHTML += `<tr>
                  <td><strong>${u.name}</strong><br><span style="color:var(--text-sub); font-size:0.7rem;">(${u.id})</span></td>
                  <td>${u.phone || '-'}<br><span style="color:var(--text-sub); font-size:0.7rem;">${u.address || '-'}</span></td>
                  <td><span style="color:var(--primary); font-weight:700;">${u.service || '쿠팡 트래픽'}</span><br><strong>${u.slots || 5} 슬롯</strong></td>
                  <td><button class="badge-status ${taxClass}" onclick="toggleStatus('${u.id}', 'tax')">${u.taxStatus || '발행대기'}</button></td>
                  <td><button class="btn btn-danger" style="padding:2px 5px; font-size:0.68rem;" onclick="deleteUser('${u.id}', '${u.name}')">삭제</button></td>
                </tr>`;
              }
            });
          } else {
            if(userTbody) userTbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:14px; color:var(--text-sub);">등록된 파트너 회원이 없습니다.</td></tr>`;
            if(taxTbody) taxTbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:14px; color:var(--text-sub);">등록된 파트너 회원이 없습니다.</td></tr>`;
          }
        }

        let slotTbody = document.getElementById('admin-slot-tbody');
        if(slotTbody) {
          slotTbody.innerHTML = '';
          let totalActiveSlots = 0;
          if(data.users && data.users.length > 0) {
            data.users.forEach((u) => {
              let sCount = u.slots || 5;
              totalActiveSlots += sCount;
              slotTbody.innerHTML += `<tr>
                <td><strong>${u.name}</strong><br><span style="color:var(--text-sub); font-size:0.7rem;">(${u.id})</span></td>
                <td><span style="color:var(--primary); font-weight:700;">${u.service || '쿠팡 트래픽'}</span></td>
                <td><strong style="font-size:0.9rem; color:var(--success);">${sCount} 슬롯 가동 중</strong></td>
                <td><span class="badge-status ${u.depositStatus === '입금완료' ? 'status-complete' : 'status-pending'}">${u.depositStatus || '입금대기'}</span></td>
              </tr>`;
            });
            let summaryBox = document.getElementById('admin-total-slot-summary');
            if(summaryBox) {
              summaryBox.innerHTML = `🔥 전체 파트너 가동 중인 총 슬롯량: <strong style="color:var(--primary);">${totalActiveSlots} 슬롯</strong> (총 ${data.users.length}개 파트너사)`;
            }
          } else {
            slotTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:14px; color:var(--text-sub);">가동 중인 파트너 슬롯이 없습니다.</td></tr>`;
          }
        }

        let inqTbody = document.getElementById('admin-inquiry-tbody');
        if(inqTbody) {
          inqTbody.innerHTML = '';
          if(data.inquiries && data.inquiries.length > 0) {
            data.inquiries.forEach((inq) => {
              inqTbody.innerHTML += `<tr>
                <td>${inq.author}</td>
                <td><strong>${inq.title}</strong><br><span style="color:var(--text-sub);">${inq.content}</span></td>
                <td><span class="badge-status ${inq.status === '답변완료' ? 'status-complete' : 'status-pending'}">${inq.status}</span></td>
                <td>
                  <textarea id="reply-${inq.id}" class="form-input" placeholder="답변 입력..." style="font-size:0.75rem; margin-bottom:3px;">${inq.reply || ''}</textarea>
                  <div style="display:flex; gap:3px;">
                    <button class="btn btn-primary" style="padding:2px 5px; font-size:0.68rem;" onclick="submitReply(${inq.id})">등록</button>
                    <button class="btn btn-danger" style="padding:2px 5px; font-size:0.68rem;" onclick="deleteInquiry(${inq.id})">삭제</button>
                  </div>
                </td>
              </tr>`;
            });
          } else {
            inqTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:14px; color:var(--text-sub);">등록된 문의가 없습니다.</td></tr>`;
          }
        }

        let ipTbody = document.getElementById('admin-ip-tbody');
        if(ipTbody && data.ipLogs) {
          ipTbody.innerHTML = '';
          if(data.ipLogs.length > 0) {
            data.ipLogs.forEach(log => {
              ipTbody.innerHTML += `<tr>
                <td><strong style="color:var(--primary);">${log.ip}</strong></td>
                <td><span style="font-weight:700; color:var(--text-main);">${log.name}</span> <span style="font-size:0.7rem; color:var(--text-sub);">(${log.id})</span></td>
                <td>${log.device}</td>
                <td style="color:var(--text-sub);">${log.time}</td>
              </tr>`;
            });
          } else {
            ipTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:14px; color:var(--text-sub);">접속 로그가 없습니다.</td></tr>`;
          }
        }

        let statusLogTbody = document.getElementById('admin-status-log-tbody');
        if(statusLogTbody && data.statusLogs) {
          statusLogTbody.innerHTML = '';
          if(data.statusLogs.length > 0) {
            data.statusLogs.forEach(sLog => {
              statusLogTbody.innerHTML += `<tr>
                <td><strong>${sLog.name}</strong> <span style="font-size:0.7rem; color:var(--text-sub);">(${sLog.userId})</span></td>
                <td><span style="color:var(--primary); font-weight:700;">${sLog.type}</span></td>
                <td>${sLog.status}</td>
                <td style="color:var(--text-sub);">${sLog.time}</td>
              </tr>`;
            });
          } else {
            statusLogTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:14px; color:var(--text-sub);">변경 이력이 없습니다.</td></tr>`;
          }
        }

      } catch(err) {}
    }

    async function toggleStatus(userId, type) {
      await fetch('/api/admin/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, type })
      });
      loadAdminData();
    }

    // 관리자 슬롯 변경 및 승인 함수
    async function updateUserSlots(userId) {
      const inputVal = document.getElementById('slot-input-' + userId).value;
      const res = await fetch('/api/admin/update-slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, slots: inputVal })
      });
      const data = await res.json();
      if (data.success) {
        alert('🚀 파트너의 슬롯 수량이 성공적으로 변경·승인되었습니다!\n이제 파트너 페이지에 실시간 반영됩니다.');
        loadAdminData();
      } else {
        alert('슬롯 변경에 실패했습니다.');
      }
    }

    async function deleteUser(userId, name) {
      if(!confirm(`정말 "${name}" 파트너 계정을 삭제하시겠습니까?`)) return;
      await fetch('/api/admin/delete-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      alert(`"${name}" 파트너가 삭제되었습니다.`);
      loadAdminData();
    }

        headers: { 'Content-Type': 'application/json' },

      });
      alert('답변이 등록되었습니다.');
      loadAdminData();
    }
